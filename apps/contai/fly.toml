# Cont.ai by Lumarcont - Fly.io (piloto). Regiao Madrid; volume persistente em /data.
app = "contai-lumarcont"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/contai.db"
  STORAGE_ROOT = "/data/arquivo"
  TESSERACT_CACHE_PATH = "/data/tesseract"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"      # o poller IMAP e os webhooks precisam do processo sempre ligado
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "contai_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
