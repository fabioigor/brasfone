<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cont.ai by Lumarcont</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0e7a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
  <div id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card">
      <div class="brand-lockup">
        <span class="brand-mark">C.ai</span>
        <div>
          <div class="brand-name">Cont.ai</div>
          <div class="brand-by">by Lumarcont</div>
        </div>
      </div>
      <p class="muted">A contabilidade do seu gabinete, com documentos lidos, conferidos e lançados por IA. Você aprova.</p>
      <label>Email
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>Palavra-passe
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn primary wide">Entrar</button>
      <p id="login-error" class="error" hidden></p>
      <p id="demo-hint" class="muted small" hidden>Demonstração: gabinete@demo.pt / gabinete123 · padaria@demo.pt / cliente123</p>
    </form>
  </div>

  <div id="app-view" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand-lockup compact">
        <span class="brand-mark">C.ai</span>
        <div>
          <div class="brand-name">Cont.ai</div>
          <div class="brand-by">by Lumarcont</div>
        </div>
      </div>
      <nav id="nav" class="sidenav"></nav>
      <div class="sidebar-foot">
        <span id="user-label" class="muted small"></span>
        <div class="row">
          <button id="theme-btn" class="btn ghost small" title="Alternar tema">◐ Tema</button>
          <button id="logout-btn" class="btn ghost small">Sair</button>
        </div>
      </div>
    </aside>
    <main id="main" class="content"></main>
  </div>

  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
