<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cont.ai</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0e7a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
  <div id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="card login-card">
      <h1>Cont.ai</h1>
      <p class="muted">Portal digital do gabinete de contabilidade</p>
      <label>Email
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>Palavra-passe
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn primary">Iniciar sessão</button>
      <p id="login-error" class="error" hidden></p>
      <p class="muted small">Demo: gabinete@demo.pt / gabinete123 · padaria@demo.pt / cliente123</p>
    </form>
  </div>

  <div id="app-view" hidden>
    <header class="topbar">
      <span class="brand">Cont.ai</span>
      <nav id="nav"></nav>
      <span class="spacer"></span>
      <span id="user-label" class="muted"></span>
      <button id="logout-btn" class="btn ghost">Sair</button>
    </header>
    <main id="main"></main>
  </div>

  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
