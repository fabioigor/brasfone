<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ContaDesk</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="card login-card">
      <h1>ContaDesk</h1>
      <p class="muted">Portal digital do gabinete de contabilidade</p>
      <label>Email
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>Palavra-passe
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn primary">Iniciar sessão</button>
      <p id="login-error" class="error" hidden></p>
      <p class="muted small">Demo: gabinete@demo.pt / gabinete123 · padaria@demo.pt / cliente123</p>
    </form>
  </div>

  <div id="app-view" hidden>
    <header class="topbar">
      <span class="brand">ContaDesk</span>
      <nav id="nav"></nav>
      <span class="spacer"></span>
      <span id="user-label" class="muted"></span>
      <button id="logout-btn" class="btn ghost">Sair</button>
    </header>
    <main id="main"></main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
